name: NOX CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Type Check & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build DB Package
        run: npm run build:db

      - name: Typecheck Web App
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Typecheck API Service
        run: npx tsc --noEmit --project apps/api/tsconfig.json

  unit-tests:
    name: API Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build DB Package
        run: npm run build:db

      - name: Run Backend Unit Tests
        run: npm run test:unit

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build DB Package
        run: npm run build:db

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        run: npm run build --workspace=apps/web

      - name: Run E2E Tests
        run: npm run test:e2e
